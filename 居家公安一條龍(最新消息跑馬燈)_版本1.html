  .container {

    font-size: 20px;

    margin-bottom: 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid #ddd;
  }

  /* 🆕 新增：資訊輪動跑馬燈樣式 */
  .marquee-wrapper {
    display: flex;
    align-items: center;
    background: #fdfaf2;
    border: 1px solid #f1e5c9;
    border-radius: 6px;
    padding: 10px 16px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .marquee-label {
    background: #c8a84b;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    margin-right: 12px;
    white-space: nowrap;
    box-shadow: 0 2px 4px rgba(200,168,75,0.2);
  }
  .marquee-container {
    flex-grow: 1;
    overflow: hidden;
    position: relative;
    height: 24px; /* 固定高度以利單行輪播 */
  }
  .marquee-content {
    display: flex;
    flex-direction: column;
    position: absolute;
    width: 100%;
    animation: marquee-vertical 12s infinite ease-in-out; /* 垂直輪播動畫 */
  }
  /* 滑鼠懸停時暫停輪播，方便民眾點擊超連結 */
  .marquee-content:hover {
    animation-play-state: paused;
  }
  .marquee-item {
    height: 24px;
    line-height: 24px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .marquee-item a {
    color: #333;
    text-decoration: none;
    font-weight: 700;
    transition: color 0.2s;
  }
  .marquee-item a:hover {
    color: #2a7ae2;
    text-decoration: underline;
  }
  .marquee-date {
    color: #888;
    font-size: 13px;
    font-weight: normal;
    margin-right: 8px;
  }

  /* 跑馬燈垂直位移動畫 (以4筆資料為例，可依實際資料量調整百分比) */
  @keyframes marquee-vertical {
    0%, 20% { transform: translateY(0); }
    25%, 45% { transform: translateY(-24px); }
    50%, 70% { transform: translateY(-48px); }
    75%, 95% { transform: translateY(-72px); }
    100% { transform: translateY(0); }
  }

  .yt-embed {

  }
  .yt-embed iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;

  }
  .yt-card-footer {
    padding: 10px 16px;
    display: flex;
    justify-content: flex-end;
    font-size: 13px;
    color: #888;
    border-top: 1px solid #eee;
  }
